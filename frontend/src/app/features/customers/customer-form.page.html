<h1>{{ isNew() ? 'New customer' : 'Edit customer' }}</h1>
<form (ngSubmit)="save()" class="form">
  <label>Name * <input [(ngModel)]="name" name="name" required /></label>
  <label>Phone <input [(ngModel)]="phone" name="phone" /></label>
  <label>Address <textarea [(ngModel)]="address" name="address" rows="2"></textarea></label>
  <label>Default rate (₹/L)
    <input type="number" step="0.01" [(ngModel)]="defaultRate" name="defaultRate" />
  </label>
  @if (!isNew()) {
    <label class="check">
      <input type="checkbox" [(ngModel)]="isActive" name="isActive" /> Active
    </label>
  }
  @if (error()) {
    <p class="err">{{ error() }}</p>
  }
  <div class="row">
    <button type="submit" class="btn" [disabled]="saving()">Save</button>
    <a routerLink="/customers" class="link">Cancel</a>
  </div>
</form>
